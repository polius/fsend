name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# No setup-go cache anywhere here: caches written by PR runs must not
# feed the release gate or the shipped bytes.

jobs:
  # The release body is written by hand: it is CHANGELOG.md's section for
  # the tag (scripts/release-notes.py), not a list of commit titles. This
  # runs first and every other job waits for it, so a tag whose section
  # is missing fails here, in seconds, with a message that says what to
  # do. The tag comes from the runner's own GITHUB_REF_NAME, read by the
  # script; nothing is expanded into the shell.
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and tags: the notes link to the comparison with
          # the previous tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/release-notes.py > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

  # Same as checks.yml's test job: tag pushes don't run PR checks, so
  # gate the release on a fresh, uncached run.
  test:
    needs: notes
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 -timeout 600s ./...

  # Never ship a known CVE: the vulnerability database may have moved
  # since the last PR run.
  govulncheck:
    needs: notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  goreleaser:
    needs: [test, govulncheck]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release and upload assets
      id-token: write     # keyless cosign + build provenance
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      # The release body (see the notes job, which already checked that
      # the section exists). Written outside the checkout: goreleaser
      # refuses to release from a dirty tree.
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release-notes.py > "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # SLSA build provenance for every archive, binary and installer:
      #   gh attestation verify <file> --repo polius/fsend
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/fsend_*/fsend
            dist/fsend_*/fsend.exe
            scripts/install.sh
            scripts/install.ps1
