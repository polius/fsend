name: go-patch

# Dependabot updates module requirements but never the `go` directive in
# go.mod, so a stdlib security release would never reach people building
# from source until someone remembered by hand. This opens the bump PR
# Dependabot can't. Patch-only on purpose: a minor bump raises the
# language floor and must land together with the golangci-lint pin in
# checks.yml (lint refuses modules newer than its own build toolchain).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - run: |
          minor=$(go mod edit -json | jq -r .Go | cut -d. -f1-2)
          go get go@$minor
      # With no diff (already current) the action skips, so quiet days
      # between Go releases cost nothing.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/go-patch
          delete-branch: true
          title: "build: bump the go directive to the latest patch release"
          commit-message: "build: bump the go directive to the latest patch release"
          body: >-
            Keeps go.mod's `go` directive at the newest patch of the current
            minor so `GOTOOLCHAIN=auto` forces a security-patched toolchain
            for every build. Scheduled from .github/workflows/go-patch.yml;
            merged automatically once checks pass.
