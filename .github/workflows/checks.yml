name: checks

on:
  push:
    branches: [main]
  pull_request:
  # go-patch.yml dispatches this for its own PRs: events from GITHUB_TOKEN
  # don't start pull_request runs, workflow_dispatch is the exception.
  workflow_dispatch:

permissions:
  contents: read

# Every gating `go test` runs with -count=1: setup-go restores GOCACHE,
# and test/e2e builds the binary in a subprocess the cache key can't see,
# so a cached e2e pass would skip the suite entirely.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 -timeout 600s ./...

  # The LAN/direct/relay paths race concurrently in production; data
  # races only surface under the race detector. Linux on both CPU
  # families: arm64's weaker memory model shakes out different races.
  race:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 -timeout 600s ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned: golangci-lint must be built with the Go version the
          # module targets (go.mod's `go` line) or it refuses to load the
          # packages. "latest" floats to releases built with older Go and
          # breaks on toolchain jumps. Dependabot keeps the pin current.
          version: v2.13.2
          args: --timeout=5m

  # Catch known CVEs in the standard library and dependencies, at the
  # toolchain go.mod pins.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Bounded fuzzing of the parsers most exposed to a malicious peer (the wire
  # codec and the path sanitizer). Seed corpora also run in the normal test
  # job; this explores beyond them for a fixed budget.
  #
  # Budgets are execution counts (Nx), not wall-clock: a duration -fuzztime
  # races the coordinator's deadline against in-flight workers on a loaded
  # runner, surfacing a spurious "context deadline exceeded" failure. Counts
  # are sized to roughly a 30s explore on a slow runner.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -run '^$' -fuzz='^FuzzReadControlRaw$' -fuzztime=2000000x ./internal/wire/
      - run: go test -run '^$' -fuzz='^FuzzReadChunk$' -fuzztime=200000x ./internal/wire/
      - run: go test -run '^$' -fuzz='^FuzzSanitizeRelativePath$' -fuzztime=1000000x ./internal/transfer/
      - run: go test -run '^$' -fuzz='^FuzzHandleDatagram$' -fuzztime=1000000x ./internal/relay/
      - run: go test -run '^$' -fuzz='^FuzzDecodeJSON$' -fuzztime=500000x ./internal/server/

  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/tools/cmd/deadcode@v0.52.0
      - run: |
          out=$(deadcode -test ./...)
          if [ -n "$out" ]; then
            echo "deadcode found unreachable symbols:"
            echo "$out"
            exit 1
          fi

  # Builds every release target with the release config itself (archives,
  # checksums, cask), so a broken target or config fails here, not on
  # release day. Signing and SBOMs need the release job's identity/tools.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Snapshot output is never published, so the cache is fine here.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7 # zizmor: ignore[cache-poisoning]
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - run: goreleaser release --snapshot --clean --skip=sign,sbom
      # Reproducible builds: rebuilding the same commit must give the same
      # bytes (no wall-clock dates, paths or build IDs in the output).
      - run: |
          cp dist/checksums.txt "$RUNNER_TEMP/first.txt"
          goreleaser release --snapshot --clean --skip=sign,sbom
          diff "$RUNNER_TEMP/first.txt" dist/checksums.txt

  install-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The installer's pre-checked os/arch list must match what the
      # release actually builds (see .goreleaser.yml).
      - run: python3 scripts/check-release-targets.py
      - run: shellcheck scripts/install.sh scripts/smoke-install.sh scripts/coverage.sh
      # Full download -> verify -> install cycle against a local fixture
      # server. --with-root-test asserts the root refusal; --with-busybox-test
      # exercises the wget fallback + ash semantics in an Alpine container.
      - run: sh scripts/smoke-install.sh --with-root-test --with-busybox-test

  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Error
          if ($findings) {
            $findings | Format-Table -AutoSize
            exit 1
          }
      - name: Smoke test
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-install.ps1

  # Lint the workflows themselves: actionlint for correctness, zizmor for
  # security (injection, permissions, unpinned actions, credential leaks).
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: pipx run zizmor==1.30.1 --offline .github/workflows

  # Coverage per package, published to the run summary; the transfer, wire,
  # quicconn and pake packages are gated on floors (scripts/coverage.sh).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          set +e
          bash scripts/coverage.sh --gate > "$RUNNER_TEMP/coverage.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/coverage.txt"
          { echo '### Coverage'; echo '```'; cat "$RUNNER_TEMP/coverage.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            merged_coverage.out
            coverage_by_package.out
          if-no-files-found: ignore

  # The one check to mark required in the ruleset: it fails unless every
  # job above passed, so new jobs are gated without touching repo settings.
  ci-ok:
    if: always()
    needs: [test, race, lint, govulncheck, fuzz, deadcode, snapshot, install-sh, install-ps1, workflows, coverage]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
