version: 2
updates:
  # cooldown: a new release waits a week before Dependabot proposes it, so a
  # hijacked publish is usually caught and yanked before it reaches main.
  # Security updates are not delayed.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Never auto-merged (dependabot-automerge.yml): actions run with the
  # workflow's token.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # init and analyze must move together, majors included.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images are pinned by digest (Dockerfile, compose); keep them current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/deploy/compose"
    schedule:
      interval: "weekly"
