<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fsend explainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bg"></div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <!-- No SVG blur filters: the capture rasterizer would re-run them for
             every frame. Soft shapes are drawn with gradients instead. -->
        <radialGradient id="cloudgrad">
          <stop offset="0%" stop-color="#403830" stop-opacity="0.95"/>
          <stop offset="52%" stop-color="#2c2622" stop-opacity="0.60"/>
          <stop offset="100%" stop-color="#2c2622" stop-opacity="0"/>
        </radialGradient>
      </defs>
    </svg>
  </div>
  <script src="engine.js"></script>
  <script src="scenes.js"></script>
</body>
</html>
