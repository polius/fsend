version: 2

project_name: fsend

before:
  hooks:
    # verify, not tidy: tidy can rewrite go.mod/go.sum, and goreleaser
    # aborts on a dirty git state mid-release.
    - go mod verify

builds:
  - id: fsend
    binary: fsend
    main: ./cmd/fsend
    env:
      - CGO_ENABLED=0
    # Reproducible: no local paths, no build ID, and every timestamp is
    # the commit's, so a rebuild of the tag matches the published bytes.
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X github.com/polius/fsend/internal/version.Version={{.Version}}
      - -X github.com/polius/fsend/internal/version.Commit={{.ShortCommit}}
      - -X github.com/polius/fsend/internal/version.Date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
      - riscv64
    goarm:
      # v6 covers the older Pi 1 / Pi Zero; v7 the rest. riscv64 is
      # linux-only, so prune it from the other OSes below.
      - "6"
      - "7"
    ignore:
      - { goos: darwin,  goarch: "386" }
      - { goos: darwin,  goarch: arm }
      - { goos: darwin,  goarch: riscv64 }
      - { goos: freebsd, goarch: "386" }
      - { goos: freebsd, goarch: arm }
      - { goos: freebsd, goarch: riscv64 }
      - { goos: windows, goarch: arm }
      - { goos: windows, goarch: riscv64 }
      # OpenBSD: ship amd64 + arm64 only (the common desktop/server targets).
      - { goos: openbsd, goarch: "386" }
      - { goos: openbsd, goarch: arm }
      - { goos: openbsd, goarch: riscv64 }

archives:
  - id: fsend
    ids:
      - fsend
    name_template: 'fsend_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info:
      mtime: '{{ .CommitDate }}'
    files:
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'
      - src: README.md
        info:
          mtime: '{{ .CommitDate }}'

homebrew_casks:
  # Publishes a cask to github.com/polius/homebrew-tap so macOS users can:
  #   brew install polius/tap/fsend   (Intel + Apple Silicon)
  - name: fsend
    ids:
      - fsend
    repository:
      owner: polius
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    directory: Casks
    homepage: 'https://github.com/polius/fsend'
    description: 'Peer-to-peer, end-to-end encrypted file transfer'
    # Binaries aren't Apple-notarized (no Developer ID), so Gatekeeper would
    # block the first run of a quarantined download. The hook strips the
    # quarantine attr; the caveat below says so at install time instead of
    # doing it silently, and points at the CI provenance to check instead.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fsend"]
          end
    caveats: |
      fsend is not notarized by Apple, so this cask removed the
      com.apple.quarantine attribute from the fsend binary to let it run.
      Verify it was built by the fsend release workflow with:
        gh attestation verify "$(brew --prefix)/bin/fsend" --repo polius/fsend
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@users.noreply.github.com
    commit_msg_template: 'brew: fsend {{ .Tag }}'

# deb, rpm and apk packages of the Linux builds, attached to the release
# (no repository yet). Each carries /usr/share/fsend/package-manager so
# `fsend --update` and `--uninstall` leave the binary to the package
# manager.
nfpms:
  - id: fsend
    ids:
      - fsend
    package_name: fsend
    # Debian calls both ARMv6 and ARMv7 "armhf", so the conventional names
    # of those two debs would collide; the ARMv6 one gets a suffix.
    file_name_template: >-
      {{- if and (eq .Format "deb") (eq .Arch "arm") (eq .Arm "6") -}}
      {{ .PackageName }}_{{ .Version }}_armhf-armv6.deb
      {{- else -}}
      {{ .ConventionalFileName }}
      {{- end -}}
    vendor: polius
    homepage: 'https://github.com/polius/fsend'
    maintainer: 'polius <polius@users.noreply.github.com>'
    description: 'Peer-to-peer, end-to-end encrypted file transfer'
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    mtime: '{{ .CommitDate }}'
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/fsend/LICENSE
        file_info:
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: packaging/package-manager.deb
        dst: /usr/share/fsend/package-manager
        packager: deb
        file_info:
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: packaging/package-manager.rpm
        dst: /usr/share/fsend/package-manager
        packager: rpm
        file_info:
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: packaging/package-manager.apk
        dst: /usr/share/fsend/package-manager
        packager: apk
        file_info:
          mode: 0644
          mtime: '{{ .CommitDate }}'

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256
  # The installers are checksummed too: `fsend --update` verifies the
  # pinned release's script against this file before running it.
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1

# Keyless Sigstore signature over checksums.txt, bound to this repo's
# release workflow; every asset is covered through its checksum line.
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/polius/fsend/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    args: [sign-blob, '--bundle=${signature}', '${artifact}', '--yes']
    output: true

sboms:
  - artifacts: archive

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

release:
  github:
    owner: polius
    name: fsend
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
