version: 2

project_name: fsend

before:
  hooks:
    # verify, not tidy: tidy can rewrite go.mod/go.sum, and goreleaser
    # aborts on a dirty git state mid-release.
    - go mod verify

builds:
  - id: fsend
    binary: fsend
    main: ./cmd/fsend
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X github.com/polius/fsend/internal/version.Version={{.Version}}
      - -X github.com/polius/fsend/internal/version.Commit={{.ShortCommit}}
      - -X github.com/polius/fsend/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
      - riscv64
    goarm:
      # v6 covers the older Pi 1 / Pi Zero; v7 the rest. riscv64 is
      # linux-only, so prune it from the other OSes below.
      - "6"
      - "7"
    ignore:
      - { goos: darwin,  goarch: "386" }
      - { goos: darwin,  goarch: arm }
      - { goos: darwin,  goarch: riscv64 }
      - { goos: freebsd, goarch: "386" }
      - { goos: freebsd, goarch: arm }
      - { goos: freebsd, goarch: riscv64 }
      - { goos: windows, goarch: arm }
      - { goos: windows, goarch: riscv64 }
      # OpenBSD: ship amd64 + arm64 only (the common desktop/server targets).
      - { goos: openbsd, goarch: "386" }
      - { goos: openbsd, goarch: arm }
      - { goos: openbsd, goarch: riscv64 }

archives:
  - id: fsend
    ids:
      - fsend
    name_template: 'fsend_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

release:
  github:
    owner: polius
    name: fsend
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
