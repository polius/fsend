version: 2

project_name: fsend

before:
  hooks:
    # verify, not tidy: tidy can rewrite go.mod/go.sum, and goreleaser
    # aborts on a dirty git state mid-release.
    - go mod verify

builds:
  - id: fsend
    binary: fsend
    main: ./cmd/fsend
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X github.com/polius/fsend/internal/version.Version={{.Version}}
      - -X github.com/polius/fsend/internal/version.Commit={{.ShortCommit}}
      - -X github.com/polius/fsend/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
      - riscv64
    goarm:
      # v6 covers the older Pi 1 / Pi Zero; v7 the rest. riscv64 is
      # linux-only, so prune it from the other OSes below.
      - "6"
      - "7"
    ignore:
      - { goos: darwin,  goarch: "386" }
      - { goos: darwin,  goarch: arm }
      - { goos: darwin,  goarch: riscv64 }
      - { goos: freebsd, goarch: "386" }
      - { goos: freebsd, goarch: arm }
      - { goos: freebsd, goarch: riscv64 }
      - { goos: windows, goarch: arm }
      - { goos: windows, goarch: riscv64 }
      # OpenBSD: ship amd64 + arm64 only (the common desktop/server targets).
      - { goos: openbsd, goarch: "386" }
      - { goos: openbsd, goarch: arm }
      - { goos: openbsd, goarch: riscv64 }

archives:
  - id: fsend
    ids:
      - fsend
    name_template: 'fsend_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

homebrew_casks:
  # Publishes a cask to github.com/polius/homebrew-tap so macOS users can:
  #   brew install polius/tap/fsend   (Intel + Apple Silicon)
  - name: fsend
    ids:
      - fsend
    repository:
      owner: polius
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    directory: Casks
    homepage: 'https://github.com/polius/fsend'
    description: 'Peer-to-peer, end-to-end encrypted file transfer'
    # Binaries aren't Apple-notarized, so Homebrew quarantines them and Gatekeeper
    # blocks the first run. Strip the quarantine attr on install.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fsend"]
          end
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@users.noreply.github.com
    commit_msg_template: 'brew: fsend {{ .Tag }}'

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

signs:
  # cosign 3.x dropped the detached --output-signature/--output-certificate in
  # favour of a single Sigstore bundle (sig + cert + tlog proof). install.sh /
  # install.ps1 verify it with `cosign verify-blob --bundle`.
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

release:
  github:
    owner: polius
    name: fsend
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
