# Self-hosted fsend pairing + relay server.
#
# Open inbound: TCP/80 (ACME), TCP/443 (HTTPS), UDP/443 (relay).
# Also needs: a domain pointing at the host, and Docker Compose v2.
#
# Usage:   export FSEND_DOMAIN=<your-domain-or-subdomain>   # e.g. fsend.alzina.dev
#          docker compose up -d
# Upgrade: docker compose pull && docker compose up -d
#
# Docs: https://github.com/polius/fsend

services:
  fsend:
    image: poliuscorp/fsend
    container_name: fsend
    command: ["server"]
    restart: unless-stopped
    ports:
      - "443:443/udp"
    environment:
      # All env vars are optional; defaults shown.
      FSEND_HTTP_ADDR: ":8080"
      FSEND_UDP_ADDR: ":443"
      FSEND_LOG_LEVEL: "info"
      # Abuse limits — tune to your bandwidth budget.
      FSEND_MAX_RELAY_BYTES_PER_SESSION: "100MiB"
      FSEND_MAX_SESSIONS_PER_IP: "5"
      FSEND_MAX_NEW_SESSIONS_PER_IP_PER_MIN: "30"
      FSEND_SESSION_IDLE_TIMEOUT: "60s"
      # Password to restrict server access (empty = open); clients use `fsend --connect <domain> <password>`.
      FSEND_SERVER_PASSWORD: ""
    healthcheck:
      test: ["CMD", "/fsend", "server", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: fsend-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 challenge
      - "443:443"   # HTTPS signaling
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # Let's Encrypt certs live here
    environment:
      FSEND_DOMAIN: "${FSEND_DOMAIN:?required, e.g. fs.example.com}"
    depends_on:
      - fsend

volumes:
  caddy_data:
