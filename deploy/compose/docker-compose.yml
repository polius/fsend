# Self-hosted fsend pairing + relay server.
#
# Open inbound: TCP/80 (ACME), TCP/443 (HTTPS), UDP/443 (relay).
# Also needs: a domain pointing at the host, and Docker Compose v2.
#
# Usage:   export FSEND_DOMAIN=<your-domain-or-subdomain>   # e.g. fsend.alzina.dev
#          docker compose up -d
# Upgrade: docker compose pull && docker compose up -d
# Pin:     export FSEND_VERSION=1.15.0   # default: latest
#
# Run exactly one fsend server per domain: pairing state is per process.
#
# Docs: https://github.com/polius/fsend

services:
  fsend:
    image: poliuscorp/fsend:${FSEND_VERSION:-latest}
    container_name: fsend
    command: ["server"]
    restart: unless-stopped
    stop_grace_period: 40s   # cover the server's 30s relay + 5s HTTP drain
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # the non-root server binds UDP/443
    ports:
      - "443:443/udp"
    # See `fsend server --help` for all settings.
    environment:
      FSEND_STATE_FILE: /state/sessions.json   # pending codes survive a redeploy
    #   FSEND_SERVER_PASSWORD: "change-me"     # restrict access (unset = open)
    volumes:
      - fsend_state:/state
    healthcheck:
      test: ["CMD", "/fsend", "server", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    container_name: fsend-caddy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"     # ACME HTTP-01 challenge
      - "443:443"   # HTTPS signaling
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # Let's Encrypt certs live here
    environment:
      FSEND_DOMAIN: "${FSEND_DOMAIN:?required, e.g. fs.example.com}"
    depends_on:
      - fsend

volumes:
  caddy_data:
  fsend_state:
