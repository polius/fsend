# Self-hosted fsend pairing + relay server.
#
# Open inbound: TCP/80 (ACME), TCP/443 (HTTPS), UDP/443 (relay).
# Also needs: a domain pointing at the host, and Docker Compose v2.
#
# Usage:   export FSEND_DOMAIN=<your-domain-or-subdomain>   # e.g. fsend.alzina.dev
#          docker compose up -d
# Upgrade: docker compose pull && docker compose up -d
#
# Docs: https://github.com/polius/fsend

services:
  fsend:
    image: poliuscorp/fsend
    container_name: fsend
    command: ["server"]
    restart: unless-stopped
    ports:
      - "443:443/udp"
    # See `fsend server --help` for all settings.
    # environment:
    #   FSEND_SERVER_PASSWORD: "change-me"   # restrict access (unset = open)
    healthcheck:
      test: ["CMD", "/fsend", "server", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: fsend-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 challenge
      - "443:443"   # HTTPS signaling
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # Let's Encrypt certs live here
    environment:
      FSEND_DOMAIN: "${FSEND_DOMAIN:?required, e.g. fs.example.com}"
    depends_on:
      - fsend

volumes:
  caddy_data:
