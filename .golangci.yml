# golangci-lint config for fsend (v2 schema).

version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - gosec
    - staticcheck
    - revive
  settings:
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
